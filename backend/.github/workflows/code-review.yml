# LLM code review on every push, via barikoi/code-review (see its README).
# Reviews each push and files issues for findings; narrow `branches` to
# limit noise. Pinned to a full commit SHA (reviewed snapshot of v1) so a
# moved/retagged ref cannot run new code with these permissions. To update,
# review the new commit, then bump the SHA below.
name: Code Review

on:
  push:
    branches: ["**"]

concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  review:
    uses: barikoi/code-review/.github/workflows/ollama-code-review.yml@v1
    with:
      runs_on: self-hosted
    secrets:
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    # Optional per-repo overrides:
    # with:
    #   model: some-other-tag
    #   severity_threshold: high